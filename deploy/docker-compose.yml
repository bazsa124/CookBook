# docker compose -f deploy/docker-compose.yml up -d --build
#
# Set TS_IP to the host's Tailscale address (tailscale ip -4) so the port is
# published on the tailnet only, never on the LAN:
#   TS_IP=100.x.y.z docker compose -f deploy/docker-compose.yml up -d --build
services:
  cookbook:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${TS_IP:?set TS_IP to the host Tailscale IP}:8738:8738"
    volumes:
      - ./cookbook-data:/data
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
